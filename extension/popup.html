<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceReader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px 11px;
      background: #ffffff;
      border-bottom: 1px solid #e4e6ef;
    }
    .logo {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .logo-text h1 { font-size: 13px; font-weight: 700; color: #1a1a2e; }
    .logo-text p  { font-size: 9.5px; color: #8e8ea0; margin-top: 1px; }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    .api-badge {
      font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.6px;
      padding: 3px 7px; border-radius: 20px; cursor: default;
    }
    .api-badge.active  { background: #d1fae5; color: #059669; border: 1px solid #a7f3d0; }
    .api-badge.browser { background: #f0f0f8; color: #8e8ea0; border: 1px solid #e4e6ef; }

    .btn-settings {
      background: none; border: none;
      color: #c0c0d0; font-size: 15px;
      cursor: pointer; padding: 2px; line-height: 1;
      transition: color 0.15s;
    }
    .btn-settings:hover { color: #6c5ce7; }

    /* ── BODY ── */
    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 13px; }

    /* ── LABELS ── */
    .label {
      font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.9px;
      color: #9090a8; margin-bottom: 5px;
    }

    /* ── TEXT BOX ── */
    .text-box {
      background: #ffffff;
      border: 1px solid #e4e6ef;
      border-radius: 9px;
      padding: 10px 12px;
      min-height: 72px; max-height: 100px;
      overflow-y: auto;
      font-size: 11.5px; line-height: 1.65;
      color: #3a3a5c;
    }
    .text-box.empty { color: #c8c8dc; font-style: italic; font-size: 11px; }
    .text-box::-webkit-scrollbar { width: 3px; }
    .text-box::-webkit-scrollbar-thumb { background: #e4e6ef; border-radius: 3px; }
    .text-meta { display: flex; justify-content: space-between; font-size: 9.5px; color: #c0c0d0; margin-top: -7px; }

    /* ── NOW READING ── */
    .now-reading {
      background: #f0eeff;
      border: 1px solid #d4ccff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px; color: #5a4fcf; line-height: 1.5;
      display: none;
    }
    .now-reading.visible { display: block; }
    .nr-label { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #9080d0; margin-bottom: 3px; }

    /* ── ERROR ── */
    .error-msg {
      font-size: 10.5px; color: #dc2626;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 7px; padding: 7px 10px; line-height: 1.5; display: none;
    }
    .error-msg.visible { display: block; }

    /* ── VOICE TOGGLE ── */
    .tog-row {
      display: flex;
      background: #eeeef8; border: 1px solid #e0e0f0;
      border-radius: 9px; padding: 3px; gap: 3px;
    }
    .tog-btn {
      flex: 1; padding: 8px 6px;
      border: none; border-radius: 7px;
      background: transparent; color: #9090a8;
      font-size: 11.5px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: all 0.15s;
    }
    .tog-btn.active {
      background: #ffffff;
      color: #5a4fcf;
      font-weight: 600;
      box-shadow: 0 1px 6px rgba(108,92,231,.15);
    }
    .tog-btn:hover:not(.active) { background: #e8e8f8; color: #6c5ce7; }

    /* ── TONES ── */
    .tones { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .tone-btn {
      padding: 8px 10px;
      border: 1.5px solid #e8e8f4; border-radius: 8px;
      background: #ffffff; color: #6e6e8a;
      font-size: 10.5px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.15s; text-align: left;
    }
    .tone-icon { font-size: 13px; }
    .tone-desc { font-size: 8.5px; color: #b0b0c8; display: block; margin-top: 1px; }
    .tone-btn.active { border-color: #6c5ce7; background: #f0eeff; color: #5a4fcf; }
    .tone-btn.active .tone-desc { color: #8878d8; }
    .tone-btn:hover:not(.active) { border-color: #c8c8e8; background: #fafafe; }

    /* ── SPEED ── */
    .speed-row { display: flex; align-items: center; gap: 9px; }
    .speed-end { font-size: 9.5px; color: #b8b8cc; }
    input[type=range] {
      flex: 1; -webkit-appearance: none;
      height: 4px; border-radius: 4px;
      background: #e4e6ef; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      box-shadow: 0 1px 4px rgba(108,92,231,.4);
    }
    .speed-val { font-size: 10.5px; color: #6c5ce7; font-weight: 600; min-width: 30px; text-align: right; }

    /* ── PROGRESS ── */
    .progress-wrap { display: flex; align-items: center; gap: 8px; }
    .progress-track { flex: 1; height: 4px; background: #e8e8f4; border-radius: 4px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6c5ce7, #a29bfe);
      width: 0%; transition: width 0.4s;
    }
    .progress-lbl { font-size: 9.5px; color: #b0b0c8; white-space: nowrap; }

    /* ── STATUS ── */
    .status-row { display: flex; align-items: center; gap: 6px; margin-top: 1px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #d8d8e8; transition: background 0.2s; }
    .dot.playing { background: #10b981; animation: blink 1.1s ease-in-out infinite; }
    .dot.paused  { background: #f59e0b; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.5} }
    .status-text { font-size: 10.5px; color: #9090a8; }

    /* ── CONTROLS ── */
    .controls { display: flex; gap: 6px; }
    .btn-play {
      flex: 1; padding: 11px;
      border: none; border-radius: 9px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff; font-size: 12.5px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(108,92,231,.25);
    }
    .btn-play:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(108,92,231,.35); }
    .btn-play:disabled { background: #e8e8f4; color: #b8b8cc; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-sm {
      width: 38px; height: 42px;
      border: 1.5px solid #e4e6ef; border-radius: 9px;
      background: #ffffff; color: #9090a8; font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
    }
    .btn-sm:hover:not(:disabled) { background: #f0eeff; color: #6c5ce7; border-color: #c4b5fd; }
    .btn-sm:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── HINT ── */
    .hint { text-align: center; font-size: 9.5px; color: #c8c8dc; padding-bottom: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎙</div>
    <div class="logo-text">
      <h1>VoiceReader</h1>
      <p>Instant Text to Speech</p>
    </div>
    <div class="header-right">
      <span class="api-badge browser" id="apiBadge">Browser</span>
      <button class="btn-settings" id="btnSettings" title="Settings">⚙</button>
    </div>
  </div>

  <div class="body">

    <div>
      <div class="label">Selected Text</div>
      <div class="text-box empty" id="textBox">
        Select text on any page, then click Play — or right-click for instant audio.
      </div>
      <div class="text-meta">
        <span id="wordCount"></span>
        <span id="charCount"></span>
      </div>
    </div>

    <div class="now-reading" id="nowReading">
      <div class="nr-label">Now reading</div>
      <div id="nowReadingText"></div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div>
      <div class="label">Voice</div>
      <div class="tog-row">
        <button class="tog-btn" id="btnMale" data-gender="male">👨 Male</button>
        <button class="tog-btn active" id="btnFemale" data-gender="female">👩 Female</button>
      </div>
    </div>

    <div>
      <div class="label">Tone Mode</div>
      <div class="tones">
        <button class="tone-btn active" data-tone="natural"><span class="tone-icon">🎵</span><span>Natural<span class="tone-desc">Balanced, clear</span></span></button>
        <button class="tone-btn" data-tone="podcast"><span class="tone-icon">🎙</span><span>Podcast<span class="tone-desc">Warm, conversational</span></span></button>
        <button class="tone-btn" data-tone="calm"><span class="tone-icon">🧘</span><span>Calm<span class="tone-desc">Slow, soothing</span></span></button>
        <button class="tone-btn" data-tone="professor"><span class="tone-icon">🎓</span><span>Professor<span class="tone-desc">Authoritative</span></span></button>
        <button class="tone-btn" data-tone="news"><span class="tone-icon">📰</span><span>News Anchor<span class="tone-desc">Brisk, precise</span></span></button>
      </div>
    </div>

    <div>
      <div class="label">Speed</div>
      <div class="speed-row">
        <span class="speed-end">0.75×</span>
        <input type="range" id="speedSlider" min="0.75" max="2.0" step="0.05" value="1.0" />
        <span class="speed-end">2×</span>
        <span class="speed-val" id="speedVal">1.0×</span>
      </div>
    </div>

    <div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-lbl" id="progressLbl"></div>
      </div>
      <div class="status-row" style="margin-top:6px;">
        <div class="dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Ready</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-sm" id="btnReplay" disabled title="Replay sentence">↩</button>
      <button class="btn-play" id="btnPlay" disabled>
        <span id="playIcon">▶</span>
        <span id="playLabel">Play</span>
      </button>
      <button class="btn-sm" id="btnPause" disabled title="Pause / Resume">⏸</button>
      <button class="btn-sm" id="btnSkip" disabled title="Skip sentence">⏭</button>
    </div>

    <div class="hint">Tip: Right-click selected text → "▶ Play with VoiceReader"</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
