<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceReader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d12;
      color: #e8e8f0;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px 11px;
      background: #13131c;
      border-bottom: 1px solid #1e1e2e;
    }
    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #7c6cff, #b06cf7);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .logo-text h1 { font-size: 13px; font-weight: 700; color: #fff; }
    .logo-text p  { font-size: 9.5px; color: #555570; margin-top: 1px; }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    .api-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 3px 7px;
      border-radius: 20px;
      cursor: default;
    }
    .api-badge.active {
      background: rgba(34,197,94,.12);
      color: #22c55e;
      border: 1px solid rgba(34,197,94,.25);
    }
    .api-badge.browser {
      background: rgba(90,90,120,.12);
      color: #555570;
      border: 1px solid #1e1e2e;
    }

    .btn-settings {
      background: none; border: none;
      color: #333355; font-size: 14px;
      cursor: pointer; padding: 2px;
      line-height: 1;
      transition: color 0.15s;
    }
    .btn-settings:hover { color: #7c6cff; }

    /* ── BODY ── */
    .body { padding: 13px 16px; display: flex; flex-direction: column; gap: 12px; }

    /* ── TEXT BOX ── */
    .label {
      font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.9px;
      color: #333355; margin-bottom: 5px;
    }
    .text-box {
      background: #13131c;
      border: 1px solid #1e1e2e;
      border-radius: 9px;
      padding: 10px 12px;
      min-height: 72px; max-height: 100px;
      overflow-y: auto;
      font-size: 11.5px; line-height: 1.65;
      color: #b0b0cc;
    }
    .text-box.empty { color: #2e2e48; font-style: italic; font-size: 11px; }
    .text-box::-webkit-scrollbar { width: 3px; }
    .text-box::-webkit-scrollbar-thumb { background: #2a2a40; border-radius: 3px; }
    .text-meta { display: flex; justify-content: space-between; font-size: 9.5px; color: #2e2e48; margin-top: -7px; }

    /* ── NOW READING ── */
    .now-reading {
      background: rgba(124,108,255,.07);
      border: 1px solid rgba(124,108,255,.18);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 11px; color: #9988ee; line-height: 1.5;
      display: none;
    }
    .now-reading.visible { display: block; }
    .nr-label { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #5544aa; margin-bottom: 3px; }

    /* ── VOICE TOGGLE ── */
    .tog-row {
      display: flex;
      background: #13131c; border: 1px solid #1e1e2e;
      border-radius: 8px; padding: 3px; gap: 3px;
    }
    .tog-btn {
      flex: 1; padding: 7px 6px;
      border: none; border-radius: 6px;
      background: transparent; color: #444465;
      font-size: 11.5px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: all 0.15s;
    }
    .tog-btn.active {
      background: linear-gradient(135deg, #7c6cff, #b06cf7);
      color: #fff;
      box-shadow: 0 2px 8px rgba(124,108,255,.35);
    }
    .tog-btn:hover:not(.active) { background: #1c1c2c; color: #9090b0; }

    /* ── TONES ── */
    .tones { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .tone-btn {
      padding: 7px 9px;
      border: 1px solid #1a1a28; border-radius: 7px;
      background: #13131c; color: #444465;
      font-size: 10.5px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.15s;
    }
    .tone-icon { font-size: 12px; }
    .tone-desc { font-size: 8.5px; color: #2e2e48; display: block; margin-top: 1px; }
    .tone-btn.active { border-color: #7c6cff; background: rgba(124,108,255,.09); color: #b0a0ff; }
    .tone-btn.active .tone-desc { color: #6655cc; }
    .tone-btn:hover:not(.active) { background: #181828; border-color: #252540; color: #8888aa; }

    /* ── SPEED ── */
    .speed-row { display: flex; align-items: center; gap: 9px; }
    .speed-end { font-size: 9.5px; color: #2e2e48; }
    input[type=range] {
      flex: 1; -webkit-appearance: none;
      height: 3px; border-radius: 3px;
      background: #1e1e2e; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px; border-radius: 50%;
      background: linear-gradient(135deg, #7c6cff, #b06cf7);
      box-shadow: 0 0 5px rgba(124,108,255,.5);
    }
    .speed-val { font-size: 10.5px; color: #7070a0; min-width: 28px; text-align: right; }

    /* ── PROGRESS ── */
    .progress-wrap { display: flex; align-items: center; gap: 8px; }
    .progress-track { flex: 1; height: 3px; background: #1a1a28; border-radius: 3px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c6cff, #b06cf7);
      width: 0%; transition: width 0.4s;
    }
    .progress-lbl { font-size: 9.5px; color: #2e2e48; white-space: nowrap; }

    /* ── STATUS ── */
    .status-row { display: flex; align-items: center; gap: 6px; margin-top: 1px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: #222235; transition: background 0.2s; }
    .dot.playing { background: #22c55e; animation: blink 1.1s ease-in-out infinite; }
    .dot.paused  { background: #f59e0b; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
    .status-text { font-size: 10.5px; color: #333355; }

    /* ── CONTROLS ── */
    .controls { display: flex; gap: 5px; }
    .btn-play {
      flex: 1; padding: 10px;
      border: none; border-radius: 8px;
      background: linear-gradient(135deg, #7c6cff, #b06cf7);
      color: #fff; font-size: 12.5px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s;
    }
    .btn-play:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(124,108,255,.4); }
    .btn-play:disabled { background: #1a1a28; color: #2e2e48; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-sm {
      width: 36px; height: 38px;
      border: 1px solid #1a1a28; border-radius: 8px;
      background: #13131c; color: #444465; font-size: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
    }
    .btn-sm:hover:not(:disabled) { background: #1c1c2c; color: #a0a0c0; }
    .btn-sm:disabled { opacity: 0.25; cursor: not-allowed; }

    /* ── ERROR ── */
    .error-msg {
      font-size: 10.5px; color: #f87171;
      background: rgba(248,113,113,.08);
      border: 1px solid rgba(248,113,113,.18);
      border-radius: 7px;
      padding: 7px 10px; line-height: 1.5;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* ── HINT ── */
    .hint { text-align: center; font-size: 9.5px; color: #222235; padding-bottom: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎙</div>
    <div class="logo-text">
      <h1>VoiceReader</h1>
      <p>Instant Text to Speech</p>
    </div>
    <div class="header-right">
      <span class="api-badge browser" id="apiBadge">Browser</span>
      <button class="btn-settings" title="Settings" onclick="chrome.runtime.openOptionsPage()">⚙</button>
    </div>
  </div>

  <div class="body">

    <div>
      <div class="label">Selected Text</div>
      <div class="text-box empty" id="textBox">
        Select text on any page, then click Play — or right-click for instant audio.
      </div>
      <div class="text-meta">
        <span id="wordCount"></span>
        <span id="charCount"></span>
      </div>
    </div>

    <div class="now-reading" id="nowReading">
      <div class="nr-label">Now reading</div>
      <div id="nowReadingText"></div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div>
      <div class="label">Voice</div>
      <div class="tog-row">
        <button class="tog-btn" id="btnMale"   onclick="selectGender('male')">👨 Male</button>
        <button class="tog-btn active" id="btnFemale" onclick="selectGender('female')">👩 Female</button>
      </div>
    </div>

    <div>
      <div class="label">Tone Mode</div>
      <div class="tones">
        <button class="tone-btn active" data-tone="natural"  onclick="selectTone('natural')"><span class="tone-icon">🎵</span><span>Natural<span class="tone-desc">Balanced, clear</span></span></button>
        <button class="tone-btn"        data-tone="podcast"  onclick="selectTone('podcast')"><span class="tone-icon">🎙</span><span>Podcast<span class="tone-desc">Warm, conversational</span></span></button>
        <button class="tone-btn"        data-tone="calm"     onclick="selectTone('calm')"><span class="tone-icon">🧘</span><span>Calm<span class="tone-desc">Slow, soothing</span></span></button>
        <button class="tone-btn"        data-tone="professor" onclick="selectTone('professor')"><span class="tone-icon">🎓</span><span>Professor<span class="tone-desc">Authoritative</span></span></button>
        <button class="tone-btn"        data-tone="news"     onclick="selectTone('news')"><span class="tone-icon">📰</span><span>News Anchor<span class="tone-desc">Brisk, precise</span></span></button>
      </div>
    </div>

    <div>
      <div class="label">Speed</div>
      <div class="speed-row">
        <span class="speed-end">0.75×</span>
        <input type="range" id="speedSlider" min="0.75" max="2.0" step="0.05" value="1.0" oninput="updateSpeed(this.value)" />
        <span class="speed-end">2×</span>
        <span class="speed-val" id="speedVal">1.0×</span>
      </div>
    </div>

    <div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-lbl" id="progressLbl"></div>
      </div>
      <div class="status-row" style="margin-top:6px;">
        <div class="dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Ready</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-sm" id="btnReplay" onclick="handleReplay()" disabled title="Replay">↩</button>
      <button class="btn-play" id="btnPlay" onclick="handlePlayStop()" disabled>
        <span id="playIcon">▶</span>
        <span id="playLabel">Play</span>
      </button>
      <button class="btn-sm" id="btnPause" onclick="handlePause()" disabled title="Pause / Resume">⏸</button>
      <button class="btn-sm" id="btnSkip"  onclick="handleSkip()"  disabled title="Skip">⏭</button>
    </div>

    <div class="hint">Right-click selected text → "▶ Play with VoiceReader" for one-click audio</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
