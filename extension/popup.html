<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceReader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d12;
      color: #e8e8f0;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px 12px;
      background: #13131c;
      border-bottom: 1px solid #1e1e2e;
    }
    .logo {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #7c6cff, #b06cf7);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .logo-text h1 { font-size: 14px; font-weight: 700; color: #fff; }
    .logo-text p  { font-size: 10px; color: #555570; margin-top: 1px; }
    .tip {
      margin-left: auto;
      font-size: 9.5px;
      color: #3a3a55;
      text-align: right;
      line-height: 1.4;
    }

    /* ── CONTENT AREA ── */
    .content { padding: 14px 18px; display: flex; flex-direction: column; gap: 13px; }

    /* ── TEXT PREVIEW ── */
    .text-box {
      background: #13131c;
      border: 1px solid #1e1e2e;
      border-radius: 10px;
      padding: 11px 13px;
      min-height: 80px;
      max-height: 110px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.65;
      color: #b0b0cc;
      position: relative;
    }
    .text-box.empty { color: #36364f; font-style: italic; font-size: 11.5px; }
    .text-box::-webkit-scrollbar { width: 3px; }
    .text-box::-webkit-scrollbar-thumb { background: #2a2a40; border-radius: 3px; }

    .text-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #36364f;
      margin-top: -8px;
    }

    /* ── NOW READING ── */
    .now-reading {
      background: rgba(124, 108, 255, 0.08);
      border: 1px solid rgba(124, 108, 255, 0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11.5px;
      color: #9988ee;
      line-height: 1.5;
      display: none;
    }
    .now-reading.visible { display: block; }
    .now-reading-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6655cc;
      margin-bottom: 4px;
    }

    /* ── SECTION LABEL ── */
    .label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: #444460;
      margin-bottom: 6px;
    }

    /* ── VOICE TOGGLE ── */
    .toggle-row {
      display: flex;
      background: #13131c;
      border: 1px solid #1e1e2e;
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
    }
    .tog-btn {
      flex: 1; padding: 8px 6px;
      border: none; border-radius: 7px;
      background: transparent;
      color: #555570;
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .tog-btn.active {
      background: linear-gradient(135deg, #7c6cff, #b06cf7);
      color: #fff;
      box-shadow: 0 2px 10px rgba(124,108,255,.35);
    }
    .tog-btn:hover:not(.active) { background: #1e1e2e; color: #a0a0c0; }

    /* ── TONE MODES ── */
    .tones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }
    .tone-btn {
      padding: 8px 10px;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      background: #13131c;
      color: #555570;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 6px;
      text-align: left;
    }
    .tone-btn .tone-icon { font-size: 13px; }
    .tone-btn .tone-desc { font-size: 9px; color: #36364f; display: block; margin-top: 1px; }
    .tone-btn.active {
      border-color: #7c6cff;
      background: rgba(124,108,255,.1);
      color: #b0a0ff;
    }
    .tone-btn.active .tone-desc { color: #7c6cff; }
    .tone-btn:hover:not(.active) { background: #1a1a28; color: #a0a0c0; border-color: #2a2a3e; }

    /* ── SPEED ── */
    .speed-row {
      display: flex; align-items: center; gap: 10px;
    }
    .speed-ends { font-size: 10px; color: #36364f; }
    input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      height: 3px;
      border-radius: 3px;
      background: #1e1e2e;
      outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c6cff, #b06cf7);
      box-shadow: 0 0 5px rgba(124,108,255,.5);
    }
    .speed-val {
      font-size: 11px; color: #9090b0;
      min-width: 30px; text-align: right;
    }

    /* ── PROGRESS ── */
    .progress-wrap {
      display: flex; align-items: center; gap: 8px;
    }
    .progress-track {
      flex: 1; height: 4px;
      background: #1e1e2e; border-radius: 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c6cff, #b06cf7);
      border-radius: 4px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .progress-label { font-size: 10px; color: #36364f; white-space: nowrap; }

    /* ── STATUS ── */
    .status-row {
      display: flex; align-items: center; gap: 6px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #2a2a3e; flex-shrink: 0;
      transition: background 0.2s;
    }
    .dot.playing { background: #22c55e; animation: blink 1.1s ease-in-out infinite; }
    .dot.paused  { background: #f59e0b; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
    .status-text { font-size: 11px; color: #36364f; }

    /* ── MAIN CONTROLS ── */
    .controls { display: flex; gap: 6px; }
    .btn-play {
      flex: 1; padding: 11px;
      border: none; border-radius: 9px;
      background: linear-gradient(135deg, #7c6cff, #b06cf7);
      color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: all 0.15s;
      letter-spacing: 0.2px;
    }
    .btn-play:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(124,108,255,.4); }
    .btn-play:disabled { background: #1e1e2e; color: #36364f; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-sm {
      width: 38px; height: 40px;
      border: 1px solid #1e1e2e;
      border-radius: 9px;
      background: #13131c;
      color: #555570; font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-sm:hover:not(:disabled) { background: #1e1e2e; color: #c0c0d8; }
    .btn-sm:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── HINT ── */
    .hint {
      text-align: center;
      font-size: 10px;
      color: #2a2a3e;
      padding-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎙</div>
    <div class="logo-text">
      <h1>VoiceReader</h1>
      <p>Instant Text to Speech</p>
    </div>
    <div class="tip">Right-click any<br>selection to play</div>
  </div>

  <div class="content">

    <!-- Selected text -->
    <div>
      <div class="label">Selected Text</div>
      <div class="text-box empty" id="textBox">
        Select text on any page, then click Play — or right-click to listen instantly.
      </div>
      <div class="text-meta">
        <span id="wordCount"></span>
        <span id="charCount"></span>
      </div>
    </div>

    <!-- Now reading tracker -->
    <div class="now-reading" id="nowReading">
      <div class="now-reading-label">Now reading</div>
      <div id="nowReadingText"></div>
    </div>

    <!-- Voice gender -->
    <div>
      <div class="label">Voice</div>
      <div class="toggle-row">
        <button class="tog-btn" id="btnMale" onclick="selectGender('male')">👨 Male</button>
        <button class="tog-btn active" id="btnFemale" onclick="selectGender('female')">👩 Female</button>
      </div>
    </div>

    <!-- Tone modes -->
    <div>
      <div class="label">Tone Mode</div>
      <div class="tones">
        <button class="tone-btn active" data-tone="natural" onclick="selectTone('natural')">
          <span class="tone-icon">🎵</span>
          <span>
            Natural
            <span class="tone-desc">Balanced, clear</span>
          </span>
        </button>
        <button class="tone-btn" data-tone="podcast" onclick="selectTone('podcast')">
          <span class="tone-icon">🎙</span>
          <span>
            Podcast
            <span class="tone-desc">Warm, conversational</span>
          </span>
        </button>
        <button class="tone-btn" data-tone="calm" onclick="selectTone('calm')">
          <span class="tone-icon">🧘</span>
          <span>
            Calm
            <span class="tone-desc">Slow, soothing</span>
          </span>
        </button>
        <button class="tone-btn" data-tone="professor" onclick="selectTone('professor')">
          <span class="tone-icon">🎓</span>
          <span>
            Professor
            <span class="tone-desc">Authoritative, clear</span>
          </span>
        </button>
        <button class="tone-btn" data-tone="news" onclick="selectTone('news')">
          <span class="tone-icon">📰</span>
          <span>
            News Anchor
            <span class="tone-desc">Brisk, precise</span>
          </span>
        </button>
      </div>
    </div>

    <!-- Speed -->
    <div>
      <div class="label">Speed</div>
      <div class="speed-row">
        <span class="speed-ends">0.75×</span>
        <input type="range" id="speedSlider" min="0.75" max="2.0" step="0.05" value="1.0" oninput="updateSpeed(this.value)" />
        <span class="speed-ends">2×</span>
        <span class="speed-val" id="speedVal">1.0×</span>
      </div>
    </div>

    <!-- Progress + status -->
    <div>
      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label" id="progressLabel"></div>
      </div>
      <div class="status-row" style="margin-top:7px;">
        <div class="dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Ready</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn-sm" id="btnReplay" onclick="handleReplay()" disabled title="Replay sentence">↩</button>
      <button class="btn-play" id="btnPlay" onclick="handlePlayStop()" disabled>
        <span id="playIcon">▶</span>
        <span id="playLabel">Play</span>
      </button>
      <button class="btn-sm" id="btnPause" onclick="handlePause()" disabled title="Pause / Resume">⏸</button>
      <button class="btn-sm" id="btnSkip" onclick="handleSkip()" disabled title="Skip sentence">⏭</button>
    </div>

    <div class="hint">Tip: Right-click selected text → "▶ Play with VoiceReader" for instant audio</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
