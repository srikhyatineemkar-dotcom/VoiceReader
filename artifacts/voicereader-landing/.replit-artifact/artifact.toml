kind = "web"
previewPath = "/"
title = "VoiceReader"
version = "1.0.0"
id = "artifacts/voicereader-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23859

[services.development]
run = "pnpm --filter @workspace/voicereader-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voicereader-landing", "run", "build" ]
publicDir = "artifacts/voicereader-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23859"
BASE_PATH = "/"
